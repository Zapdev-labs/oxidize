[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oxidize-python"
version = "0.1.0"
description = "Pure-Python Oxidize inference workspace (parallel to oxidize-core)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
oxidize = "oxidize_python.cli:main"
oxidize-quantize = "oxidize_python.quantize.cli:main"
oxidize-train = "oxidize_python.train.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["oxidize_python"]

[tool.pytest.ini_options]
testpaths = ["oxidize_python"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
