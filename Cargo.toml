[workspace]
members = [
    "oxidize-core",
    "oxidize-cli",
    "oxidize-server",
    "oxidize-quantize",
    "oxidize-py",
    "oxidize-train",
    "oxidize-finetuning",
    "oxidize-convert",
    "oxidize-ffi",
    "oxidize-kernels",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Zapdev-Fair-Use"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
pyo3 = "0.28"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"

[profile.release]
lto = true
panic = "abort"
