[workspace]
members = [
    "oxidize-core",
    "oxidize-cli",
    "oxidize-server",
    "oxidize-quantize",
    "oxidize-py",
    "oxidize-train",
    "oxidize-finetuning",
    "oxidize-convert",
    "oxidize-prune",
    "oxidize-merge",
    "oxidize-ffi",
    "oxidize-kernels",
]
exclude = [
    "vendor/libp2p-dns",
    "vendor/libp2p-mdns",
    "vendor/libp2p-yamux",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Zapdev-Fair-Use"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
pyo3 = "0.29"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"

[profile.release]
lto = true
panic = "abort"
# Single codegen unit lets LLVM inline and optimize across the whole crate
# (no parallel-codegen boundaries). Slower builds, faster deploy binary — the
# right trade for a latency-bound inference engine.
codegen-units = 1

[patch.crates-io]
libp2p-dns = { path = "vendor/libp2p-dns" }
libp2p-mdns = { path = "vendor/libp2p-mdns" }
libp2p-yamux = { path = "vendor/libp2p-yamux" }
