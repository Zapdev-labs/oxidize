[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "llamas"
version = "0.1.0"
description = "Python bindings for llamas-cpp"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.maturin]
module-name = "llamas"
bindings = "pyo3"
include = ["llamas.pyi", "py.typed"]
