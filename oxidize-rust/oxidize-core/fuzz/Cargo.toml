[package]
name = "oxidize-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.oxidize-core]
path = ".."

[[bin]]
name = "gguf_parser"
path = "fuzz_targets/gguf_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenizer"
path = "fuzz_targets/tokenizer.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
