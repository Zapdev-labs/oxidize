[package]
name = "oxidize-cli"
edition.workspace = true
license.workspace = true
version.workspace = true
autobins = false

[[bin]]
name = "oxidize-cli"
path = "src/main.rs"

[[bin]]
name = "oxidize"
path = "src/main.rs"

[[bin]]
name = "oxidize-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "inspect_gguf"
path = "src/bin/inspect_gguf.rs"

[[bin]]
name = "gguf_layer_keys"
path = "src/bin/gguf_layer_keys.rs"

[[bin]]
name = "diffusion_gemma_bench"
path = "src/bin/diffusion_gemma_bench.rs"
required-features = ["oxk"]

[features]
oxk = ["oxidize-core/oxk", "oxidize-server/oxk"]
# GPU backends — passthrough to oxidize-core so `oxidize run --backend cuda` works
# from a single `cargo build -p oxidize-cli --features cuda`.
cuda = ["oxidize-core/cuda"]
rocm = ["oxidize-core/rocm"]
vulkan = ["oxidize-core/vulkan"]

[dependencies]
clap.workspace = true
oxidize-core = { path = "../oxidize-core" }
oxidize-server = { path = "../oxidize-server" }
futures-core = "0.3"
libc = "0.2"
rand = "0.8"
rayon = "1"
serde = { workspace = true }
serde_json = "1"
tokio.workspace = true
tracing.workspace = true
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
assert_cmd = "2"
