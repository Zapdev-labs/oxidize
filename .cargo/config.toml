[build]
target-dir = "target"

# Keep the default x86_64 build portable. Hot kernels use runtime CPU feature
# detection and #[target_feature] so AVX2/FMA machines still take fast paths.

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.wasm32-unknown-unknown]
runner = "wasmtime run --dir=."
rustflags = ["-C", "target-feature=+simd128"]
