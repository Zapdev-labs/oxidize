repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: c-build
        name: oxidize-c build (-Werror)
        entry: bash -c 'make -C oxidize-c build'
        language: system
        pass_filenames: false
        files: ^oxidize-c/.*\.(c|h)$

      - id: c-test
        name: oxidize-c tests
        entry: bash -c 'make -C oxidize-c test'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^oxidize-c/.*\.(c|h)$

      - id: tui-typecheck
        name: oxidize-tui typecheck
        entry: bash -c 'cd oxidize-tui && bun install && bun run typecheck'
        language: system
        pass_filenames: false
        files: ^oxidize-tui/.*\.(ts|tsx|json)$
