[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  "RUSTSEC-2024-0436",
  # memmap2 is pulled transitively by current model-loading dependencies.
  # Keep the advisory visible here until the dependency graph can move to a
  # fixed release without dropping mmap support.
  "RUSTSEC-2026-0186",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "LicenseRef-Zapdev-Fair-Use",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
