name: Cancel superseded

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    name: Cancel superseded runs
    runs-on: ubuntu-latest
    steps:
      - name: Cancel queued and in-progress runs for older SHAs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          KEEP: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pr_ref="refs/pull/${PR}/head"
          for status in queued in_progress; do
            ids=$(gh run list --repo "$REPO" --status "$status" --limit 100 \
              --json databaseId,headSha,headBranch \
              --jq ".[] | select(.headSha != \"${KEEP}\" and (.headBranch == \"${BRANCH}\" or .headBranch == \"${pr_ref}\")) | .databaseId")
            for id in $ids; do
              echo "cancel $id"
              gh run cancel "$id" --repo "$REPO" || true
            done
          done
