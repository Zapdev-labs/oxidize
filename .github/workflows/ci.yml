name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  c:
    name: oxidize-c (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
          - os: ubuntu-24.04
            cc: clang
    defaults:
      run:
        working-directory: oxidize-c
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang
      - name: Build
        env:
          CC: ${{ matrix.cc }}
        run: make clean && make -j"$(nproc)" build
      - name: Version
        run: ./oxidize-c --version
      - name: Test
        env:
          CC: ${{ matrix.cc }}
        run: make test

  tui:
    name: oxidize-tui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and test
        working-directory: oxidize-tui
        run: |
          bun install
          bun run typecheck
          bun test

  docker:
    name: Docker C image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI image
        run: docker build -f Dockerfile.cli -t oxidize-c:test .
