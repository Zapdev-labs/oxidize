name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  rust:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Dependency/license audit
        run: cargo deny check

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Build
        run: cargo build --workspace --all-targets --release

  docker:
    name: Docker build smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f Dockerfile.server -t llamas-server:test .

      - name: Build CLI image
        run: docker build -f Dockerfile.cli -t llamas-cli:test .

  benchmarks:
    name: Benchmarks and regression detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run benchmark regression checker unit tests
        run: python3 -m unittest scripts/test_ci_benchmark_regression.py

      - name: Run benchmark dashboard unit tests
        run: python3 -m unittest scripts/test_ci_benchmark_dashboard.py

      - name: Run criterion benchmarks
        run: cargo bench -p llamas-core --bench criterion -- --noplot

      - name: Detect benchmark regressions
        run: python3 scripts/ci_benchmark_regression.py

      - name: Generate benchmark dashboard
        run: python3 scripts/ci_benchmark_dashboard.py

      - name: Upload benchmark dashboard
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-dashboard
          path: target/benchmark-dashboard
