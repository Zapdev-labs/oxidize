name: Go

on:
  pull_request:
    paths:
      - "golang/**"
      - ".github/workflows/go.yml"
  push:
    paths:
      - "golang/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: golang/go.mod
      - name: gofmt
        run: |
          cd golang
          test -z "$(gofmt -l .)"
      - name: go vet
        run: |
          cd golang
          go vet ./...
      - name: go test
        run: |
          cd golang
          go test ./...
      - name: go test -race
        run: |
          cd golang
          go test -race ./...
