name: Go

on:
  pull_request:
    paths:
      - "golang/**"
      - ".github/workflows/go.yml"
  push:
    paths:
      - "golang/**"
      - ".github/workflows/go.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: golang/go.mod
      - name: gofmt
        run: |
          cd golang
          test -z "$(gofmt -l .)"
      - name: go vet
        run: |
          cd golang
          go vet ./...
      - name: go test
        run: |
          cd golang
          go test ./...
      - name: go test -race
        run: |
          cd golang
          go test -race ./...
