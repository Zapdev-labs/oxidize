name: Python

on:
  pull_request:
    paths:
      - "oxidize-python/**"
      - ".github/workflows/python.yml"
  push:
    paths:
      - "oxidize-python/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync and test
        run: |
          cd oxidize-python
          uv sync --extra dev
          uv run ruff check oxidize_python
          uv run pytest -q
