name: oxidize Rust CI

on:
  push:
    branches: ["master", "oxidize-c-v2"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Avoid the pre-existing borrow-check error in oxidize-finetuning/qlora.rs
  # which breaks whole-workspace builds. The MUST product (CLI + server) is
  # unaffected and is what we test here.

jobs:
  build:
    name: Build core product
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."

      - name: Build core crates
        run: cargo build --release -p oxidize-cli -p oxidize-server -p oxidize-quantize -p oxidize-convert

  test:
    name: Test core crates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."

      - name: Test core crates
        run: cargo test -p oxidize-core -p oxidize-cli -p oxidize-server -p oxidize-kernels
